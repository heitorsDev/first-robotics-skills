# Example: run a review skill (pr-code-review / frc-code-review / ftc-code-reviewer) on
# every PR push, and post its report as an actual GitHub PR review — not a plain comment.
#
# See ./README.md for why `gh pr review` is used instead of `gh pr comment`. Swap the slash
# command in "Run the review skill" for whichever of the three review skills this repo uses.
# Adapt that step to whatever agent CLI/harness your team runs.

name: pr-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the agent CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the review skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The skill's final message IS the report, nothing else — capture it verbatim.
          claude -p "/pr-code-review" --permission-mode acceptEdits > report.md

      - name: Post the review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" --comment --body-file report.md
          # Swap --comment for --request-changes / --approve here if you want the report's
          # verdict to drive the review's state — that mapping is this workflow's call, not
          # the skill's; the skill only ever produces the report.
