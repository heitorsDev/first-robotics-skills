name: release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'main'
      && (
        startsWith(github.event.pull_request.head.ref, 'fix/')
        || startsWith(github.event.pull_request.head.ref, 'feat/')
        || startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: resolve bump type
        id: bump
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          echo "type=$(bash scripts/ci/bump-type-from-branch.sh "$HEAD_BRANCH")" >> "$GITHUB_OUTPUT"

      - name: find changed skill
        id: skill
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # github.event.pull_request.base.sha is not reliable here: when two PRs
          # merge close together, GitHub can report a base.sha from before the
          # other one landed, making this diff span both merges. The merge
          # commit's own first parent is exact regardless of what else merged
          # around the same time — it's always "main right before this merge."
          base_sha="$(git rev-parse "${MERGE_SHA}^1")"
          skill_dirs="$(git diff --name-only "$base_sha" "$MERGE_SHA" \
            | grep -oE '^skills/(general|frc|ftc)/[^/]+' \
            | sort -u)"
          if [ -z "$skill_dirs" ]; then
            echo "no skill folder changed in this PR — nothing to release"
            echo "name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(echo "$skill_dirs" | wc -l)" -gt 1 ]; then
            echo "::error::more than one skill folder changed in this merge — refusing to guess which to release: $(echo "$skill_dirs" | tr '\n' ' ')"
            exit 1
          fi
          echo "name=$(basename "$skill_dirs")" >> "$GITHUB_OUTPUT"

      - name: bump, tag and regenerate
        if: steps.skill.outputs.name != ''
        id: release
        env:
          SKILL_NAME: ${{ steps.skill.outputs.name }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          set -euo pipefail
          current="$(git tag -l "${SKILL_NAME}@*" --sort=-v:refname | head -n1 | sed "s/^${SKILL_NAME}@//")"
          [ -n "$current" ] || current="0.0.0"
          next="$(bash scripts/ci/bump-version.sh "$current" "$BUMP_TYPE")"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${SKILL_NAME}@${next}"
          bash scripts/ci/generate-marketplaces.sh

          git add skills
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${SKILL_NAME}@${next} [skip ci]"
            git push origin HEAD:main
          fi
          git push origin "${SKILL_NAME}@${next}"

          echo "tag=${SKILL_NAME}@${next}" >> "$GITHUB_OUTPUT"

      - name: create GitHub release
        if: steps.skill.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
